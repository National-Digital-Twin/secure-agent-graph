name: Run Smoke Tests on Deploy

on:
  push:
    branches:
#      - 'main'
      - 'feature/run-smoke-tests-on-deploy-ro'

env:
  AWS_REGION: eu-west-2
  AWS_ACCESS_KEY_ID: smoke-test
  AWS_SECRET_ACCESS_KEY: smoke-test
  JWKS_URL: http://localhost:9229/local_6GLuhxhD/.well-known/jwks.json
  HURL_VERSION: 6.1.1

jobs:
  run-sag-smoke-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker RUN
        run: |
          for pkg in docker.io docker-doc docker-compose docker-compose-v2 podman-docker containerd runc; do sudo apt-get remove $pkg; done
          sudo apt-get update
          sudo apt-get install ca-certificates curl -y
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
            $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}") stable" | \
            sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update
          sudo apt-get install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin -y
          sudo docker run hello-world
          sudo apt-add-repository -y ppa:lepapareil/hurl 
          sudo apt install hurl="${{ env.HURL_VERSION }}"*
          sudo apt-get install jq
          sudo apt-get upgrade -y
          sudo snap install aws-cli --classic 
          export AWS_SECRET_ACCESS_KEY=nothing
          export AWS_ACCESS_KEY_ID=nothing
          export AWS_REGION=nothing
          env | grep AWS
          snap list
          docker version
          cd sag-docker/Test
          docker compose up -d
          docker ps
          ./smoke-test-local-no-auth.sh
          echo "===Auth Test ==="
          curl localhost:3031
          curl localhost:9229
          ./smoke-test-local-auth.sh