#        run: |
#          ID_TOKEN=$(aws --endpoint http://0.0.0.0:9229 cognito-idp initiate-auth --client-id 6967e8jkb0oqcm9brjkrbcrhj --auth-flow USER_PASSWORD_AUTH --auth-parameters USERNAME=$USER_1,PASSWORD=password | jq -r '.AuthenticationResult.IdToken')
#          curl -XPOST -T ./sag-docker/Test/data1.trig --header "Content-type: text/trig" -H "Authorization: bearer $ID_TOKEN" http://localhost:3030/ds/upload

      - name: Download Smoke Test Dependencies
        run: |
          sudo apt-add-repository -y ppa:lepapareil/hurl 
          sudo apt install hurl="${{ env.HURL_VERSION }}"*
          sudo apt-get install jq

      - name: Run secure-agent-graph Smoke Tests
        run: |
          cd sag-docker/Test
          ./smoke-test-local.sh

