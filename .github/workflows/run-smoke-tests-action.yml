#          -classpath "sag-server/target/classes:sag-system/target/classes:sag-docker/target/dependency/*" \
#          uk.gov.dbt.ndtp.secure.agent.graph.SecureAgentGraph \
#          --config sag-docker/mnt/config/dev-server-graphql.ttl &
#
