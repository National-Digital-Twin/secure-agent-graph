name: Run Smoke Tests on Deploy

on:
  push:
    branches:
#      - 'main'
      - 'feature/run-smoke-tests-on-deploy'

env:
  AWS_REGION: eu-west-2
  AWS_ACCESS_KEY_ID: smoke-test
  AWS_SECRET_ACCESS_KEY: smoke-test
  JWKS_URL: http://localhost:9229/local_6GLuhxhD/.well-known/jwks.json
  HURL_VERSION: 6.1.1

jobs:
  run-sag-smoke-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Docker Network
        run: |
          docker network create smoke-test

      - name: Set up Cognito Local
        run: |
          docker run -d --name cognito-local-ndtp \
            -v ./sag-docker/Test/cognito-local:/app/.cognito \
            -p 9229:9229 \
            --network smoke-test \
            jagregory/cognito-local:latest

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'pom.xml'

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          echo "<settings><servers><server><id>github</id><username>${{ github.actor }}</username><password>${{ secrets.GH_PACKAGES_PAT }}</password></server></servers></settings>" > ~/.m2/settings.xml

      - name: Build secure-agent-graph
        run: mvn clean install --batch-mode --no-transfer-progress -Dgpg.skip=true

      - name: start sag docker container
        run: |
          cd sag-docker
          docker build -t nick-sag-test-1 .
          docker run -d -e JWKS_URL=http://cognito-local-ndtp:9229/local_6GLuhxhD/.well-known/jwks.json \
          --network smoke-test --name nick-sag-smoke-test-build nick-sag-test-1

      - name: Test container is working
        run: |
          sleep 30
          curl http://localhost:3030/ds || true
          docker logs nick-sag-smoke-test-build

