name: Run Smoke Tests on Deploy

on:
  push:
    branches:
#      - 'main'
      - 'feature/run-smoke-tests-on-deploy'
      - 'feature/run-smoke-tests-on-deploy-josh'

env:
  HURL_VERSION: 6.1.1

jobs:
  run-sag-smoke-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Smoke Test Dependencies
        run: |
          sudo apt-add-repository -y ppa:lepapareil/hurl && sudo apt install jq hurl="${{ env.HURL_VERSION }}*"

      - name: Start Smoke Test Containers
        run: |
          cd sag-docker/Test
          docker compose up -d
          while [[ true ]]; do curl http://localhost:3031/$/ping && exit 0 || sleep 3; done

      - name: Run SAG auth-smoke-tests
        run: |
          cd sag-docker/Test
          ./smoke-test-local-auth.sh

      - name: Run SAG no-auth-smoke-tests
        run: |
          cd sag-docker/Test
          ./smoke-test-local-no-auth.sh

      - name: Clean up Containers
        run: |
          cd sag-docker/Test
          docker compose down
